# Default Maven tests cannot connect to the developer database.
spring.datasource.url=jdbc:h2:mem:lunea_test;MODE=PostgreSQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=false
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.thinh.cosmetic=WARN
spring.main.banner-mode=off
lunea.recovery.ttl-minutes=15
lunea.recovery.request-limit=3
lunea.recovery.request-window-minutes=15
lunea.recovery.reset-limit=10
lunea.recovery.public-base-url=http://localhost:8080
lunea.recovery.sender=no-reply@lunea.test
