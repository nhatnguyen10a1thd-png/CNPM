<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body data-page="brands">
    <!-- Header Fragment -->
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="site-main" id="main-content">
        <div class="lunea-container">
            <!-- Breadcrumbs -->
            <div style="font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 24px;" class="reveal-on-scroll">
                <a th:href="@{/}" href="/" style="color: var(--color-text-secondary);">Trang chủ</a>
                <span style="margin: 0 6px;">/</span>
                <span style="color: var(--color-gold-light);">Thương hiệu</span>
            </div>

            <!-- Page Title (European Editorial Style) -->
            <div style="margin-bottom: 40px;" class="reveal-on-scroll">
                <h1 style="font-family: var(--font-serif); font-size: clamp(2.2rem, 4vw, 3.2rem); font-weight: 500; color: var(--color-text-primary); margin-bottom: 10px;">
                    Thương hiệu đồng hành
                </h1>
                <p style="font-size: 1rem; color: var(--color-text-secondary); max-width: 600px; font-weight: 300;">
                    Tuyển chọn các nhãn hàng dược mỹ phẩm và chăm sóc sắc đẹp hàng đầu từ Châu Âu, Châu Mỹ và Châu Á, được phân phối chính hãng 100% tại LUNEA.
                </p>
            </div>

            <!-- Brands Grid -->
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px;" class="reveal-on-scroll stagger-cards">
                <div th:each="b : ${brands}" class="luxury-product-card" style="padding: 24px;">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px;">
                        <span class="eyebrow-tag" style="font-size: 0.65rem; padding: 2px 10px;">Chính hãng</span>
                    </div>

                    <h3 style="font-family: var(--font-serif); font-size: 1.45rem; font-weight: 600; letter-spacing: 0.04em; color: var(--color-text-primary); margin-bottom: 10px;" 
                        th:text="${b.name}">
                        LA ROCHE-POSAY
                    </h3>

                    <p style="font-size: 0.88rem; color: var(--color-text-secondary); line-height: 1.6; margin-bottom: 24px; font-weight: 300;" 
                        th:text="${b.description != null ? b.description : 'Dòng sản phẩm chăm sóc da chuẩn y khoa được tin dùng toàn cầu.'}">
                        Mô tả thương hiệu.
                    </p>

                    <div style="margin-top: auto; padding-top: 18px; border-top: 1px solid var(--color-border-subtle); display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 0.78rem; color: var(--color-text-muted);">Phân phối toàn chuỗi</span>
                        <a th:href="@{/products(brandId=${b.id})}" class="btn-product-outline" style="width: auto; padding: 8px 18px; font-size: 0.82rem;">
                            <span>Khám phá</span>
                            <span style="margin-left: 4px;">→</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <!-- Toast Fragment -->
    <div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
