<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!-- Admin Back-office Head Fragment -->
<head th:fragment="adminHead(title)">
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="theme-color" content="#0d0f12">
    <meta name="color-scheme" content="dark light">
    <title th:text="${title != null ? title : 'LUNEA Back-office Portal'}">LUNEA Back-office Portal</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}" href="/images/favicon.svg">
    <link rel="apple-touch-icon" th:href="@{/images/favicon.svg}" href="/images/favicon.svg">

    <!-- Instant Theme Bootstrap (Prevents theme flash on reload) -->
    <script>
        (function() {
            try {
                var savedTheme = localStorage.getItem('lunea-theme');
                var theme = savedTheme ? savedTheme : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
            } catch(e) {}
        })();
    </script>

    <!-- Google Fonts: Streamlined luxury typography (Be Vietnam Pro, Cinzel, Playfair Display, Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- LUNEA Design Tokens & Admin CSS -->
    <link rel="stylesheet" th:href="@{/css/tokens.css}" href="/css/tokens.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
    <link rel="stylesheet" th:href="@{/css/print.css}" href="/css/print.css" media="print">
    <script th:src="@{/js/api.js}" src="/js/api.js" defer></script>
</head>
</html>
