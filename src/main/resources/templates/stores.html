<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body data-page="stores">
    <!-- Header Fragment -->
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="site-main" id="main-content">
        <div class="lunea-container">
            <!-- Breadcrumbs -->
            <div style="font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 24px;" class="reveal-on-scroll">
                <a th:href="@{/}" href="/" style="color: var(--color-text-secondary);">Trang chủ</a>
                <span style="margin: 0 6px;">/</span>
                <span style="color: var(--color-gold-light);">Chuỗi cửa hàng</span>
            </div>

            <!-- Page Title -->
            <div style="margin-bottom: 40px;" class="reveal-on-scroll">
                <h1 style="font-family: var(--font-serif); font-size: clamp(2.2rem, 4vw, 3.2rem); font-weight: 500; color: var(--color-text-primary); margin-bottom: 10px;">
                    Hệ thống showroom LUNEA
                </h1>
                <p style="font-size: 1rem; color: var(--color-text-secondary); max-width: 600px; font-weight: 300;">
                    Không gian mua sắm và tư vấn sắc đẹp chuẩn khoa học tại các vị trí trung tâm sầm uất.
                </p>
            </div>

            <!-- Stores Grid -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;" class="reveal-on-scroll stagger-cards">
                <div th:each="s : ${stores}" class="luxury-product-card" style="padding: 24px;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;">
                        <div>
                            <span class="eyebrow-tag" th:text="${s.province}" style="font-size: 0.65rem; padding: 2px 10px;">TP. Hồ Chí Minh</span>
                            <h3 style="font-family: var(--font-serif); font-size: 1.35rem; font-weight: 500; color: var(--color-text-primary); margin-top: 10px;" th:text="${s.name}">
                                LUNEA Đồng Khởi - Quận 1
                            </h3>
                        </div>
                        <span class="badge-stock in-stock" style="font-size: 0.7rem;">Mở cửa</span>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 12px; font-size: 0.88rem; color: var(--color-text-secondary); margin-bottom: 24px; font-weight: 300;">
                        <div style="display: flex; gap: 10px; align-items: flex-start;">
                            <i class="bi bi-geo-alt" style="color: var(--color-gold-primary); font-size: 1rem; flex-shrink: 0; margin-top: 2px;"></i>
                            <span th:text="${s.address}">123 Đường Đồng Khởi, Phường Bến Nghé, Quận 1</span>
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <i class="bi bi-telephone" style="color: var(--color-gold-primary); font-size: 1rem; flex-shrink: 0;"></i>
                            <span th:text="${s.phone}">028.3822.9999</span>
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <i class="bi bi-clock" style="color: var(--color-gold-primary); font-size: 1rem; flex-shrink: 0;"></i>
                            <span th:text="${s.openTime} + ' – ' + ${s.closeTime}">08:30 – 22:00</span>
                        </div>
                    </div>

                    <div style="margin-top: auto; padding-top: 18px; border-top: 1px solid var(--color-border-subtle); display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 0.75rem; color: var(--color-text-muted);">Tồn kho thời gian thực</span>
                        <a th:href="@{/products}" href="/products" class="btn-product-outline" style="width: auto; padding: 8px 18px; font-size: 0.82rem;">
                            <span>Xem sản phẩm</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <!-- Toast Fragment -->
    <div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
