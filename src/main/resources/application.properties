spring.application.name=Cosmetic Store Chain Management

# ==========================================
# CẤU HÌNH CỔNG SERVER (Render sẽ cấp cổng động qua $PORT)
# ==========================================
server.port=${PORT:8080}

# ==========================================
# CƠ SỞ DỮ LIỆU: LOCAL DÙNG SQL SERVER, CLOUD TỰ NHẬN POSTGRESQL
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=lunea;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.microsoft.sqlserver.jdbc.SQLServerDriver}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.SQLServerDialect}
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.use_nationalized_character_data=${SPRING_JPA_USE_NATIONALIZED:true}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# GZIP COMPRESSION & FORWARD HEADERS (Front-End Checklist)
# ==========================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
server.forward-headers-strategy=framework

# ==========================================
# UTF-8 & CHARACTER ENCODING
# ==========================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true

spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html;charset=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

spring.web.resources.chain.cache=false
spring.messages.encoding=UTF-8

# ==========================================
# SECURITY & JWT
# ==========================================
# App Security & JWT Config
app.jwt.secret=lunea_super_secret_jwt_key_must_be_at_least_32_bytes_long_for_hs256

app.jwt.access-ttl=7200
app.security.cookie-secure=${COOKIE_SECURE:false}

# ==========================================
# MAIL CONFIGURATION (Brevo REST API / Resend / Gmail SMTP Fallback)
# ==========================================
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:nhatnguyen10a1thd@gmail.com}

resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:nhatnguyen10a1thd@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
app.mail.from-name=${APP_MAIL_FROM_NAME:LUNEA Cosmetics}
app.mail.from-email=${MAIL_FROM:no-reply@lunea.vn}

